name: Build Banana Pi BPI-R4 Firmware

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '选择 0x5826 源码分支 (建议 openwrt-25.12)'
        required: true
        default: 'openwrt-25.12'
        type: choice
        options:
          - openwrt-25.12
          - master
      upload_release:
        description: '是否发布到 GitHub Releases'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  REPO_URL: https://github.com/0x5826/immortalwrt-mtk.git
  REPO_BRANCH: ${{ inputs.repo_branch || 'openwrt-25.12' }}
  UPLOAD_RELEASE: ${{ inputs.upload_release != false }}
  CONFIG_FILE: bpir4.config
  TZ: Asia/Shanghai
  CCACHE_DIR: /workdir/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 初始化编译宿主环境与清理磁盘空间
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 快速清理非必要大型预装工具，释放约 25GB 磁盘空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir "$CCACHE_DIR"
          sudo chown -R $USER:$GROUPS /workdir

          # 优化 apt 安装：跳过推荐文档与 man-db 更新，快速就绪编译依赖工具
          sudo apt-get -q update
          sudo apt-get -y --no-install-recommends install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-pyelftools rsync \
            unzip zlib1g-dev file ccache xsltproc device-tree-compiler \
            libelf-dev p7zip p7zip-full wget curl

      - name: 克隆源码、更新 Feeds 与集成外部插件
        working-directory: /workdir
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt

          # 禁用纯有线场景不使用的 feeds (video, telephony)
          sed -i 's/^src-git video/#src-git video/g' feeds.conf.default 2>/dev/null || true
          sed -i 's/^src-git telephony/#src-git telephony/g' feeds.conf.default 2>/dev/null || true

          # 确保集成 Nikki 与 0x5826/openwrt-packages-extras 扩展软件源
          grep -q "OpenWrt-nikki" feeds.conf.default || \
            echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" >> feeds.conf.default
          grep -q "openwrt-packages-extras" feeds.conf.default || \
            echo "src-git dante_extras https://github.com/0x5826/openwrt-packages-extras.git" >> feeds.conf.default

          # 更新 Feeds 并清理将被外部原版仓库替代或存在依赖冲突的包目录
          ./scripts/feeds update -a
          rm -rf feeds/packages/sound/mpd feeds/packages/sound/squeezelite
          rm -rf feeds/packages/net/mosdns feeds/packages/net/v2ray-geodata feeds/luci/applications/luci-app-mosdns
          rm -rf feeds/dante_extras/lucky feeds/dante_extras/luci-app-lucky
          ./scripts/feeds install -a

          # 1. 集成 Lucky 原版官方源码
          git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/lucky

          # 2. 集成 MosDNS v5 与 v2ray-geodata 套件
          git clone --depth 1 https://github.com/sbwml/luci-app-mosdns -b v5 package/mosdns
          git clone --depth 1 https://github.com/sbwml/v2ray-geodata package/v2ray-geodata

          # 3. 集成 EasyTier 原版官方异地组网套件
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git package/luci-app-easytier

          # 4. 集成 NetSpeedTest (iPerf3 测速面板)
          git clone --depth 1 https://github.com/muink/luci-app-netspeedtest.git package/luci-app-netspeedtest

          # 5. 集成 shadcn/ui 现代侧边栏主题 (luci-theme-shadcn)
          git clone --depth 1 https://github.com/eamonxg/luci-theme-shadcn.git package/luci-theme-shadcn

      - name: 恢复 Ccache 与源码依赖缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-bpir4-${{ env.REPO_BRANCH }}-${{ hashFiles('bpir4.config') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-openwrt-bpir4-${{ env.REPO_BRANCH }}-${{ hashFiles('bpir4.config') }}-
            ${{ runner.os }}-openwrt-bpir4-${{ env.REPO_BRANCH }}-
            ${{ runner.os }}-openwrt-bpir4-

      - name: 注入自定义 Patch 补丁 (内核与系统分流应用)
        working-directory: /workdir/openwrt
        run: |
          if [ -d "$GITHUB_WORKSPACE/patches" ] && [ -n "$(ls -A $GITHUB_WORKSPACE/patches/*.patch 2>/dev/null)" ]; then
            echo "==> 检测到自定义补丁，开始依次注入..."
            for patch_file in $GITHUB_WORKSPACE/patches/*.patch; do
              patch_name=$(basename "$patch_file")
              # 若补丁修改的是内核底层驱动 (drivers/arch/net/fs/include/linux)
              if grep -qE '^\+\+\+ [ab]/(drivers|arch|net|fs|include/linux)/' "$patch_file"; then
                echo "-> 注入 Linux 内核目标补丁: $patch_name 到 target/linux/mediatek/patches-*"
                find target/linux/mediatek/ -maxdepth 1 -type d -name "patches-*" -exec cp -fv "$patch_file" {}/ \;
              else
                echo "-> 应用 OpenWrt 根目录补丁: $patch_name"
                patch -p1 --no-backup-if-mismatch < "$patch_file" || git apply "$patch_file" || true
              fi
            done
            echo "==> 补丁注入完成。"
          else
            echo "==> 未发现 patches/*.patch 文件，跳过此步骤。"
          fi

      - name: 配置 Ccache 与加载自定义配置
        working-directory: /workdir/openwrt
        run: |
          [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          [ -d $GITHUB_WORKSPACE/files ] && cp -rf $GITHUB_WORKSPACE/files/* files/ 2>/dev/null || true

          # 配置 Ccache 最大缓存占用为 5GB 并打印初始状态
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G
          ccache -z
          echo "=========================================================="
          echo " 编译前 Ccache 状态"
          echo "=========================================================="
          ccache -s

          make defconfig

          echo "=========================================================="
          echo " 关键编译配置生效核验"
          echo "=========================================================="
          grep -E 'CONFIG_TARGET_ARCH_PACKAGES|CONFIG_TARGET_OPTIMIZATION|CONFIG_CCACHE=|CONFIG_CCACHE_DIR|CONFIG_PACKAGE_nikki|CONFIG_PACKAGE_luci-app-nikki|CONFIG_PACKAGE_mihomo|CONFIG_PACKAGE_easytier|CONFIG_PACKAGE_cloudflared-next|CONFIG_PACKAGE_lucky' .config || true

      - name: 下载软件包依赖缓存
        working-directory: /workdir/openwrt
        run: |
          make download -j8
          # 仅清理 dl/ 顶层下载失败的残缺文件 (<1KB)，禁止递归进入 dl/go-mod-cache 误删 Go 模块源码
          find dl -maxdepth 1 -type f -size -1024c -exec ls -l {} \;
          find dl -maxdepth 1 -type f -size -1024c -exec rm -f {} \;

      - name: 执行多核编译
        working-directory: /workdir/openwrt
        run: |
          echo "=========================================================="
          echo " 开始多核并行编译 (核心数: $(nproc))"
          echo "=========================================================="
          make -j$(($(nproc) + 1)) || make -j1 V=s
          echo "=========================================================="
          echo " 编译后 Ccache 命中统计"
          echo "=========================================================="
          ccache -s
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "TAG_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

      - name: 整理打包构建产物与校验文件
        working-directory: /workdir/openwrt
        run: |
          mkdir -p /workdir/upload
          # 拷贝编译输出的目标固件及清单文件
          cp -f bin/targets/mediatek/filogic/*.* /workdir/upload/ 2>/dev/null || true
          cd /workdir/upload

          # 生成 SHA256 校验清单（排除自身）
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS 2>/dev/null || true

          cat <<EOF > release_notes.txt
          ### 🚀 Banana Pi BPI-R4 固件构建发布

          - **构建日期**: $(date "+%Y-%m-%d %H:%M:%S %Z")
          - **上游源码**: [${{ env.REPO_URL }}](${{ env.REPO_URL }})
          - **构建分支**: \`${{ env.REPO_BRANCH }}\`
          - **核心特性与说明**:
            - ⚙️ **Cortex-A73 编译优化**: 启用 \`-O2 -pipe -march=armv8-a+crypto+crc -mtune=cortex-a73\`，保留 \`aarch64_cortex-a53\` 软件源兼容。
            - ⚡ **硬件包转发优化**: 适配 MT7988 三硬件包处理引擎与流表卸载，降低高并发 CPU 负载。
            - 🔇 **系统日志优化**: 过滤底层调试输出，保持系统日志整洁。
            - 💾 **存储驱动支持**: 预装 M.2 NVMe SSD 与常用文件系统驱动（ext4/btrfs/f2fs）。
            - 🌐 **纯有线主路由适配**: 彻底移除无线驱动、固件及不必要的后台定时清理脚本。
            - 🎨 **界面主题**: 预置基于 shadcn/ui 风格的侧边栏现代主题 (\`luci-theme-shadcn\`)。
            - 🛠️ **常用套件**: Nikki (Mihomo)、MosDNS v5、Lucky、EasyTier、Cloudflared Next、NetSpeedTest、Samba4 等。

          #### 🔐 SHA256 校验和
          \`\`\`text
          $(cat SHA256SUMS)
          \`\`\`
          EOF

          echo "ARTIFACT_PATH=/workdir/upload" >> $GITHUB_ENV

      - name: 上传固件至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPI-R4-ImmortalWrt-${{ env.FILE_DATE }}
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 14

      - name: 自动发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_RELEASE == 'true' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: BPI-R4-${{ env.TAG_DATE }}
          name: Banana Pi BPI-R4 固件发布 (${{ env.TAG_DATE }})
          body_path: /workdir/upload/release_notes.txt
          files: /workdir/upload/*
