name: Build Banana Pi BPi-R4 Firmware

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: bpir4.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 初始化编译宿主环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get -y update
          sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆源码与拉取外部应用包
        working-directory: /workdir
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt

          # 禁用存在潜在循环依赖的 video feed
          sed -i 's/^src-git video/#src-git video/g' feeds.conf.default 2>/dev/null || true

          # 1. 拉取 Lucky 官方源码仓库至 package 目录
          git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/lucky

          # 2. 拉取 Design 主题与配置面板 (Lua 兼容分支)
          git clone --depth 1 -b js https://github.com/gngpp/luci-theme-design.git package/luci-theme-design 2>/dev/null || \
          git clone --depth 1 https://github.com/kenzok8/luci-theme-design.git package/luci-theme-design
          git clone --depth 1 https://github.com/gngpp/luci-app-design-config.git package/luci-app-design-config 2>/dev/null || \
          git clone --depth 1 https://github.com/kenzok8/luci-app-design-config.git package/luci-app-design-config

          # 3. 拉取带完整中文汉化的 MosDNS v5 官方仓库
          git clone --depth 1 https://github.com/sbwml/luci-app-mosdns -b v5 package/mosdns

          # 更新并安装 Feeds
          ./scripts/feeds update -a
          
          # 清除导致递归依赖的未用音频包
          rm -rf feeds/packages/sound/mpd feeds/packages/sound/squeezelite
          
          ./scripts/feeds install -a

      - name: 加载自定义配置与预设
        working-directory: /workdir/openwrt
        run: |
          [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          [ -d $GITHUB_WORKSPACE/files ] && cp -rf $GITHUB_WORKSPACE/files files
          make defconfig

      - name: 下载软件包依赖缓存
        working-directory: /workdir/openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 执行多核编译
        working-directory: /workdir/openwrt
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 整理打包构建产物
        working-directory: /workdir/openwrt
        run: |
          mkdir -p /workdir/upload
          cp -f bin/targets/mediatek/filogic/*.* /workdir/upload/ 2>/dev/null || true
          cd /workdir/upload
          rm -f *.manifest sha256sums
          echo "ARTIFACT_PATH=/workdir/upload" >> $GITHUB_ENV

      - name: 上传固件至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPi-R4-ImmortalWrt-${{ env.FILE_DATE }}
          path: ${{ env.ARTIFACT_PATH }}
