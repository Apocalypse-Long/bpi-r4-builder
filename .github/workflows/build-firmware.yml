name: Build Banana Pi BPi-R4 Firmware

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/0x5826/immortalwrt-mtk.git
  REPO_BRANCH: master
  CONFIG_FILE: bpir4.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 初始化编译宿主环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get -y update
          sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆 0x5826 专属源码与集成外部组件
        working-directory: /workdir
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt

          # 禁用有依赖冲突隐患的 video feed
          sed -i 's/^src-git video/#src-git video/g' feeds.conf.default 2>/dev/null || true

          # 1. Lucky 官方源码
          git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/lucky

          # 2. 0x676e67 官方 Design 主题 (main 分支即为 Lua 版本) 与配套配置面板
          git clone --depth 1 https://github.com/0x676e67/luci-theme-design.git package/luci-theme-design
          git clone --depth 1 https://github.com/kenzok8/luci-app-design-config.git package/luci-app-design-config

          # 3. MosDNS v5 全中文汉化套件
          git clone --depth 1 https://github.com/sbwml/luci-app-mosdns -b v5 package/mosdns

          # 4. EasyTier 组网套件
          git clone --depth 1 https://github.com/EasyTier/luci-app-easytier.git package/luci-app-easytier

          # 5. FileTransfer 网页传输助手
          git clone --depth 1 https://github.com/f8q8/luci-app-filetransfer.git package/luci-app-filetransfer

          # 更新并安装 Feeds
          ./scripts/feeds update -a
          rm -rf feeds/packages/sound/mpd feeds/packages/sound/squeezelite
          ./scripts/feeds install -a

      - name: 注入自定义 Patch 补丁
        working-directory: /workdir/openwrt
        run: |
          if [ -d "$GITHUB_WORKSPACE/patches" ] && [ -n "$(ls -A $GITHUB_WORKSPACE/patches/*.patch 2>/dev/null)" ]; then
            echo "==> 检测到自定义补丁，开始依次注入..."
            for patch_file in $GITHUB_WORKSPACE/patches/*.patch; do
              echo "正在应用补丁: $(basename "$patch_file")"
              patch -p1 --no-backup-if-mismatch < "$patch_file" || {
                echo "!! 补丁 $(basename "$patch_file") 应用失败，尝试 git apply..."
                git apply --check "$patch_file" && git apply "$patch_file"
              }
            done
            echo "==> 补丁注入完成。"
          else
            echo "==> 未发现 patches/*.patch 文件，跳过此步骤。"
          fi

      - name: 加载自定义配置与预设
        working-directory: /workdir/openwrt
        run: |
          [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          [ -d $GITHUB_WORKSPACE/files ] && cp -rf $GITHUB_WORKSPACE/files files
          make defconfig

      - name: 下载软件包依赖缓存
        working-directory: /workdir/openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 执行多核编译
        working-directory: /workdir/openwrt
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 整理打包构建产物
        working-directory: /workdir/openwrt
        run: |
          mkdir -p /workdir/upload
          cp -f bin/targets/mediatek/filogic/*.* /workdir/upload/ 2>/dev/null || true
          cd /workdir/upload
          rm -f *.manifest sha256sums
          echo "ARTIFACT_PATH=/workdir/upload" >> $GITHUB_ENV

      - name: 上传固件至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPi-R4-ImmortalWrt-MTK-${{ env.FILE_DATE }}
          path: ${{ env.ARTIFACT_PATH }}
